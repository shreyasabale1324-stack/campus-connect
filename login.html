<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Campus Connect</title>

    <link rel="stylesheet" href="css/auth.css">

</head>


<body>


    <div class="auth-container">


        <div class="auth-box">


            <h2>
                Welcome Back 👋
            </h2>


            <p>
                Login to continue your Campus Connect journey
            </p>



            <form>


                <input 
                type="email" 
                placeholder="Enter your email">


                <input 
                type="password" 
                placeholder="Enter your password">



                <button type="submit">
                    Login
                </button>


            </form>



            <p class="switch">

                Don't have an account?

                <a href="signup.html">
                    Sign Up
                </a>

            </p>


        </div>


    </div>


</body>


</html>
