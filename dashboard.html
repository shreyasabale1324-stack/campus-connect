<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         NAVBAR
    ========================== -->

    <nav class="navbar">

        <div class="logo">
            StudentHub
        </div>

        <button id="logoutBtn">
            Logout
        </button>

    </nav>


    <!-- =========================
         DASHBOARD
    ========================== -->

    <main class="dashboard">

        <section class="welcome">

            <h1>
                Welcome, <span id="studentName">Student</span> 👋
            </h1>

            <p>
                Here's what's happening with your studies.
            </p>

        </section>


        <!-- =========================
             DASHBOARD CARDS
        ========================== -->

        <section class="dashboard-cards">

            <div class="dashboard-card">

                <h3>📚 Courses</h3>

                <p class="card-number">
                    6
                </p>

                <p>
                    Active Courses
                </p>

            </div>


            <div class="dashboard-card">

                <h3>📝 Assignments</h3>

                <p class="card-number">
                    4
                </p>

                <p>
                    Pending Assignments
                </p>

            </div>


            <div class="dashboard-card">

                <h3>📅 Attendance</h3>

                <p class="card-number">
                    85%
                </p>

                <p>
                    Overall Attendance
                </p>

            </div>


            <div class="dashboard-card">

                <h3>🏆 CGPA</h3>

                <p class="card-number">
                    9.2
                </p>

                <p>
                    Current CGPA
                </p>

            </div>

        </section>


        <!-- =========================
             QUICK ACTIONS
        ========================== -->

        <section class="quick-actions">

            <h2>
                Quick Actions
            </h2>

            <div class="action-buttons">

                <button>
                    📚 View Courses
                </button>

                <button>
                    📝 Assignments
                </button>

                <button>
                    📊 View Grades
                </button>

                <button>
                    📅 Attendance
                </button>

            </div>

        </section>

    </main>


    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
